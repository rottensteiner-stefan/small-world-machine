<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="stylesheet" href="/assets/shared.css" />
    <link rel="stylesheet" href="/assets/tool-theme.css" />
    <title>Pixler — Small World Machine</title>
    <style>
      body {
        margin: 0;
        font-family: var(--tool-font-ui);
        background-color: var(--tool-bg);
        color: var(--tool-text);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      
      .container {
        display: flex;
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        background: var(--tool-panel-solid);
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <header class="tool-header">
      <h1>Pixler</h1>
      <button class="tool-close-btn" id="toolCloseBtn" title="Close Window" onclick="if (window.parent && window.parent !== window) { window.parent.postMessage({ type: 'close-tool' }, '*'); } try { window.close(); } catch(e) {}">✕</button>
    </header>
    <script>if (window.self !== window.top || window.opener) document.body.classList.add("in-window");</script>
    
    <div class="container" id="tool-container">
    </div>

    <footer class="app-footer">Copyright 2026 Stefan Rottensteiner // Small World Machine</footer>

    <script type="module">
      import { Pixler } from "/packages/tools/src/Pixler.ts";
      
      const container = document.getElementById("tool-container");
      const pixler = new Pixler({ parent: container });
      window.pixlerInstance = pixler;
    </script>
  </body>
</html>
