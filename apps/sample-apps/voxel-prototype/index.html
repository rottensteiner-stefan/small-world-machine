<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmallWorldMachine — Voxel Prototype (M2)</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0b0e13;
        overflow: hidden;
      }
      #SmallWorldMachine {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #voxel-stats {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        padding: 10px 14px;
        background: rgba(10, 12, 16, 0.82);
        border: 1px solid #2a3140;
        border-radius: 8px;
        color: #dbe4f0;
        font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        user-select: none;
        min-width: 220px;
      }
      #voxel-hint {
        position: fixed;
        bottom: 14px;
        left: 14px;
        z-index: 10;
        padding: 8px 12px;
        background: rgba(10, 12, 16, 0.7);
        border: 1px solid #2a3140;
        border-radius: 8px;
        color: #8ba0bd;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        user-select: none;
      }
      #voxel-stats .stat-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      #voxel-stats .stat-row span {
        color: #7d8aa0;
      }
      #voxel-stats .stat-row b {
        color: #e8eef7;
        font-weight: 600;
      }
      #voxel-crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        z-index: 9;
        pointer-events: none;
      }
      #voxel-crosshair::before,
      #voxel-crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
      }
      #voxel-crosshair::before {
        left: 50%;
        top: 0;
        width: 2px;
        height: 100%;
        transform: translateX(-50%);
      }
      #voxel-crosshair::after {
        top: 50%;
        left: 0;
        height: 2px;
        width: 100%;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <div id="voxel-stats" role="status"></div>
    <div id="voxel-hint">
      click canvas to capture mouse · WASD move · LMB break · RMB place · 1-5 select block( dirt ·
      stone · wood · water · grass ) · ESC release
    </div>
    <div id="voxel-crosshair" aria-hidden="true"></div>
    <canvas id="SmallWorldMachine"></canvas>
    <script type="module" src="/apps/sample-apps/voxel-prototype/App.ts"></script>
  </body>
</html>
