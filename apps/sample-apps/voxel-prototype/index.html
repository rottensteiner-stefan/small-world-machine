<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmallWorldMachine — Voxel Prototype (M0)</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0b0e13;
        overflow: hidden;
      }
      #SmallWorldMachine {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #voxel-stats {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        padding: 10px 14px;
        background: rgba(10, 12, 16, 0.82);
        border: 1px solid #2a3140;
        border-radius: 8px;
        color: #dbe4f0;
        font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        user-select: none;
        min-width: 220px;
      }
      #voxel-stats .stat-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      #voxel-stats .stat-row span {
        color: #7d8aa0;
      }
      #voxel-stats .stat-row b {
        color: #e8eef7;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="voxel-stats" role="status"></div>
    <canvas id="SmallWorldMachine"></canvas>
    <script type="module" src="/apps/sample-apps/voxel-prototype/App.ts"></script>
  </body>
</html>
